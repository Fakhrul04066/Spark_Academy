<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Spark Academy electric lightning emblem">
<defs>
 <linearGradient id="tile" x1="5" y1="4" x2="60" y2="61" gradientUnits="userSpaceOnUse"><stop stop-color="#312052"/><stop offset="1" stop-color="#101326"/></linearGradient>
 <linearGradient id="energy" x1="40" y1="10" x2="24" y2="55" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE0A3"/><stop offset=".35" stop-color="#B5A1FF"/><stop offset=".7" stop-color="#60EFFF"/><stop offset="1" stop-color="#23BDDF"/></linearGradient>
 <linearGradient id="edge" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse"><stop stop-color="#A18AFF"/><stop offset=".55" stop-color="#4DE8FF"/><stop offset="1" stop-color="#FFCA79"/></linearGradient>
</defs>
<style>
 .core{transform-origin:32px 32px;animation:charge 5.6s ease-in-out infinite}
 .arc{stroke-dasharray:80;stroke-dashoffset:80;opacity:0;animation:strike 5.6s ease-out infinite}
 .arc-second{animation-delay:.15s}
 .halo{opacity:.18;animation:halo 5.6s ease-in-out infinite}
 .spark{transform-origin:49px 49px;animation:twinkle 5.6s ease-in-out infinite}
 @keyframes charge{0%,63%,87%,100%{filter:drop-shadow(0 0 1px #64eaff);transform:scale(1)}70%,79%{filter:drop-shadow(0 0 5px #64eaff);transform:scale(1.035)}}
 @keyframes strike{0%,65%{opacity:0;stroke-dashoffset:80}69%{opacity:1}78%{opacity:1;stroke-dashoffset:0}85%,100%{opacity:0;stroke-dashoffset:0}}
 @keyframes halo{0%,62%,90%,100%{opacity:.18}73%,80%{opacity:.8}}
 @keyframes twinkle{0%,62%,90%,100%{transform:scale(.85);opacity:.65}75%{transform:scale(1.16);opacity:1}}
 @media(prefers-reduced-motion:reduce){.core,.arc,.halo,.spark{animation:none}.core{filter:none}.arc{opacity:0}.spark{opacity:1}}
</style>
<rect x="1" y="1" width="62" height="62" rx="18" fill="url(#tile)"/>
<rect class="halo" x="2" y="2" width="60" height="60" rx="17" stroke="url(#edge)" stroke-width="2"/>
<path class="core" d="M37 9 17 34h13l-5 21 24-30H35l2-16Z" fill="url(#energy)"/>
<path class="arc" d="m9 19 8 3-5 5 8 4-8 8 7 3" stroke="#5DEBFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path class="arc arc-second" d="m48 8-4 9 8 3-6 7 9 5-6 8" stroke="#BEA5FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="m42 10 4-4M51 16l5-1" stroke="#96F5FF" stroke-width="2.5" stroke-linecap="round"/>
<path class="spark" d="m49 43 1.5 4.5L55 49l-4.5 1.5L49 55l-1.5-4.5L43 49l4.5-1.5L49 43Z" fill="#FFCA79"/>
</svg>